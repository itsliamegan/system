EMAIL=liam@liamegan.com

EDITOR=emacs -nw

XDG_CONFIG_HOME=${HOME}/.config
XDG_CACHE_HOME=${HOME}/.cache
XDG_DATA_HOME=${HOME}/.local/share
XDG_STATE_HOME=${HOME}/.local/state

PATH=${HOME}/.local/share/mise/shims:${HOME}/.local/bin:${HOME}/.local/share/cargo/bin:${PATH}

HISTFILE=${XDG_STATE_HOME}/bash/history
LESSHISTFILE=${XDG_STATE_HOME}/less/history

ASPELL_CONF=home-dir ${XDG_DATA_HOME}/aspell

PI_CODING_AGENT_DIR=${XDG_CONFIG_HOME}/pi
PI_CODING_AGENT_SESSION_DIR=${XDG_STATE_HOME}/pi/sessions

PYTHON_HISTORY=${XDG_STATE_HOME}/python/history
CARGO_HOME=${XDG_DATA_HOME}/cargo
RUSTUP_HOME=${XDG_DATA_HOME}/rustup
NODE_REPL_HISTORY=${XDG_STATE_HOME}/node/repl_history
npm_config_cache=${XDG_CACHE_HOME}/npm
SQLITE_HISTORY=${XDG_STATE_HOME}/sqlite/history
