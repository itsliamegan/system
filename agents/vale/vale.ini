StylesPath = styles
MinAlertLevel = suggestion

# Vale splits a comment into sentences and skips its inline code only when the
# comment is read as Markdown.
[formats]
py = md
js = md
mjs = md
cjs = md
jsx = md
ts = md
mts = md
cts = md
tsx = md

# A file with no section is not linted, so extensionless scripts produce no
# findings from their code.
[*.{md,py,rs,js,mjs,cjs,jsx,ts,mts,cts,tsx,toml}]
BasedOnStyles = Writing
Writing.InsteadOf = NO

[*.rs]
View = RustComments

[*.toml]
View = TOMLComments

# Commit messages and pull request descriptions arrive on stdin under this path.
[message.md]
Writing.InsteadOf = YES
