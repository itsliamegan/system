<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
	<alias>
		<family>serif</family>
		<prefer>
			<family>Georgia</family>
		</prefer>
	</alias>

	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Helvetica Neue</family>
		</prefer>
	</alias>

	<alias>
		<family>system-ui</family>
		<prefer>
			<family>Helvetica Neue</family>
		</prefer>
	</alias>

	<alias>
		<family>system-ui</family>
		<prefer>
			<family>Helvetica Neue</family>
		</prefer>
	</alias>

	<alias>
		<family>monospace</family>
		<prefer>
			<family>DejaVu Sans Mono</family>
		</prefer>
	</alias>

	<match target="pattern">
		<test qual="any" name="family"><string>Helvetica</string></test>
		<edit name="family" mode="assign" binding="same"><string>Helvetica Neue</string></edit>
	</match>

	<match target="pattern">
		<test qual="any" name="family"><string>Liberation Mono</string></test>
		<edit name="family" mode="assign" binding="same"><string>DejaVu Sans Mono</string></edit>
	</match>
</fontconfig>
